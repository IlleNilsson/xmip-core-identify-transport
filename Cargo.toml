[package]
name = "xmip-core-identify-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-identify-transport"
description = "Identify by transport: one named property the carrier promoted, an MQTT client id or an AMQP container id; a transport-layer claim, passed. A xmip-core-identify technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the identifier trait, the arrival and the claim live
# there. The mechanism it reads is declared once in xmip-core (ADR-0050).
identify = { package = "xmip-core-identify", git = "https://github.com/IlleNilsson/xmip-core-identify", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[lints]
workspace = true
